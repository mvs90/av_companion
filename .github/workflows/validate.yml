name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.13'
            homeassistant: '2025.3.4'
          - python: '3.14'
            homeassistant: '2026.9.4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "homeassistant==${{ matrix.homeassistant }}" "pytest>=8,<10" "pytest-asyncio>=0.25,<2" "ruff>=0.9,<1" "numpy>=2.2,<3" "PyTurboJPEG>=1.7.5,<2"
      - uses: actions/checkout@v7
        with:
          repository: mvs90/lg_rs232_ip
          ref: v2.0.0
          path: .test-dependencies/lg
      - run: python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.test-dependencies/lg
      - run: ruff check custom_components tests
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
